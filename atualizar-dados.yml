name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06h no horário de Brasília
  workflow_dispatch:       # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados oficiais
        run: python scripts/atualizar_dados.py

      - name: Salvar dados no repositório
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "painel-bot"
            git config user.email "painel-bot@users.noreply.github.com"
            git add data
            git commit -m "Atualiza dados"
            git push
          else
            echo "Sem mudanças nos dados."
          fi
